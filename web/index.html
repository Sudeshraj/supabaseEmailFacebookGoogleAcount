<body>

  <!-- ==================== 🔥 FIREBASE INITIALIZATION ==================== -->
  <script>
    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAnllE8MwHPRHDlEjo50_fMrzwyxNlvq-c",
      authDomain: "saloonf-ba359.firebaseapp.com",
      projectId: "saloonf-ba359",
      storageBucket: "saloonf-ba359.firebasestorage.app",
      messagingSenderId: "624521405165",
      appId: "1:624521405165:web:09323a1025f02b668262e4",
      measurementId: "G-925VW9Z44F"
    };

    // Initialize Firebase safely.
    // If the Firebase scripts failed to load (ad blocker, offline,
    // unsupported browser) the rest of this file must still run, so
    // `messaging` stays null and every function below handles that.
    let messaging = null;
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        messaging = firebase.messaging();
      } else {
        console.warn('⚠️ Firebase SDK not loaded - notifications disabled');
      }
    } catch (e) {
      console.error('❌ Firebase init failed:', e);
      messaging = null;
    }

    // Variable to store current token
    let currentFcmToken = null;

    // Function to save token and notify Flutter
    function saveTokenAndNotify(token) {
      if (token && token !== currentFcmToken) {
        currentFcmToken = token;
        console.log('✅ FCM Token:', token);
        localStorage.setItem('fcm_token', token);
        window.dispatchEvent(new CustomEvent('fcm-token-refresh', { detail: { token: token } }));
      }
    }

    // ================================================================
    // ✅ EXPOSE FUNCTIONS TO FLUTTER (User action එකෙන් පස්සේ call කරන්න)
    // ================================================================

    // ✅ Flutter එකෙන් call කරන්න - Permission Request
    window.requestNotificationPermission = async function () {
      console.log('🌐 Web: Requesting notification permission from user action');
      if (!messaging || !('Notification' in window)) return false;
      try {
        const permission = await Notification.requestPermission();
        console.log('🔔 Notification permission:', permission);

        if (permission === 'granted') {
          const token = await messaging.getToken({
            vapidKey: 'BFj7Eoc2BRmQQrXHBFvWXjcmeb3seAyHmOpVZEOLpKTpwbelZoo5tqci-o7KR-sr0hgO9yIYDRV1KP88vhV0l6k'
          });
          saveTokenAndNotify(token);
          return true;
        }
        return false;
      } catch (error) {
        console.error('❌ Error getting notification permission:', error);
        return false;
      }
    };

    // ✅ Flutter එකෙන් call කරන්න - Get Permission Status
    window.getNotificationPermissionStatus = function () {
      return ('Notification' in window) ? Notification.permission : 'denied';
    };

    // ✅ Flutter එකෙන් call කරන්න - Get Token
    window.getFcmToken = async function () {
      if (!messaging || !('Notification' in window)) return null;
      try {
        if (Notification.permission === 'granted') {
          const token = await messaging.getToken();
          if (token) {
            saveTokenAndNotify(token);
            return token;
          }
        }
        return null;
      } catch (error) {
        console.error('❌ Error getting FCM token:', error);
        return null;
      }
    };

    if (messaging) {
      // ================================================================
      // ✅ Handle foreground messages (app is open)
      // ================================================================
      messaging.onMessage((payload) => {
        console.log('📩 Foreground message received:', payload);

        if (Notification.permission === 'granted' && payload.notification) {
          new Notification(payload.notification.title || 'New Notification', {
            body: payload.notification.body || 'You have a new notification',
            icon: '/favicon.png',
            badge: '/icons/Icon-192.png',
            data: payload.data,
          });
        }

        window.dispatchEvent(new CustomEvent('fcm-message-received', { detail: payload }));
      });

      // ================================================================
      // ✅ Periodic token check (every 24 hours)
      // ================================================================
      setInterval(async () => {
        if (Notification.permission === 'granted') {
          try {
            const newToken = await messaging.getToken();
            if (newToken && newToken !== currentFcmToken) {
              console.log('🔄 Token changed during periodic check');
              saveTokenAndNotify(newToken);
            }
          } catch (e) {
            console.error('Periodic token check failed:', e);
          }
        }
      }, 24 * 60 * 60 * 1000);

      // ================================================================
      // 🔥 DO NOT AUTO-REQUEST PERMISSION ON PAGE LOAD
      // Only get token if permission already granted
      // ================================================================
      if (Notification.permission === 'granted') {
        console.log('🔔 Notification permission already granted, getting token...');
        messaging.getToken()
          .then(token => {
            if (token) saveTokenAndNotify(token);
          })
          .catch(err => console.error('Error getting token:', err));
      } else {
        console.log('🔔 Notification permission NOT granted.');
        console.log('📌 Will ask when user clicks "Enable" in the app.');
        console.log('📌 Current status:', Notification.permission);
      }
    }

    // ================================================================
    // ✅ Listen for token refresh from service worker
    // ================================================================
    if (navigator.serviceWorker) {
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'TOKEN_REFRESHED') {
          console.log('🔄 Token refreshed from SW:', event.data.token);
          saveTokenAndNotify(event.data.token);
        }
      });
    }

    // ================================================================
    // ✅ Handle notification click when app is opened via notification
    // ================================================================
    window.addEventListener('load', () => {
      const pendingNotification = sessionStorage.getItem('pending_notification');
      if (pendingNotification) {
        sessionStorage.removeItem('pending_notification');
        try {
          const data = JSON.parse(pendingNotification);
          window.dispatchEvent(new CustomEvent('fcm-notification-clicked', { detail: data }));
        } catch (e) {
          console.error('Error parsing pending notification:', e);
        }
      }
    });

    console.log('🌐 Web: Notification service initialized WITHOUT auto-permission request');
  </script>

  <!-- ==================== SERVICE WORKER REGISTRATION ==================== -->
  <!--
    Flutter 3.34+ (flutter_bootstrap.js) auto-registers its own
    service worker internally. Manually registering
    'flutter_service_worker.js' here a second time at the same scope ('/')
    conflicts with that auto-registration and can cause the browser to be
    unsure which SW should own push/notification events.

    Only the Firebase messaging service worker is registered manually here.
    Do NOT add a manual flutter_service_worker.js registration back in.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then((registration) => {
            console.log('✅ Firebase SW registered:', registration.scope);
          })
          .catch((error) => {
            console.log('❌ Firebase SW registration failed:', error);
          });
      });
    }
  </script>

  <!-- ==================== URL STRATEGY ==================== -->
  <script>
    (function () {
      var url = window.location.href;
      var isAuthCallback = url.includes('/auth/callback');
      var hasFragment = window.location.hash && window.location.hash.length > 1;

      if (isAuthCallback && hasFragment) {
        console.log('🔐 Auth callback detected');
        var fragment = window.location.hash.substring(1);

        if (fragment.includes('=')) {
          var baseUrl = url.split('#')[0];
          var separator = baseUrl.includes('?') ? '&' : '?';
          var newUrl = baseUrl + separator + fragment;
          history.replaceState(null, null, newUrl);
          console.log('✅ Converted fragment to query params');
        }
      } else if (window.location.hash === '#/') {
        window.location.hash = '';
      }
    })();
  </script>
